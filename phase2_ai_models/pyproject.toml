[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phase2-ai-models"
version = "0.1.0"
description = "Phase 2 Intent-Aware AI modules (L3→L4) per ADR-0005"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
