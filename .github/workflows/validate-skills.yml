name: Validate Skills

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ruff Python lint
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.11.8
          args: check --output-format=github .

      - name: Validate SKILL.md frontmatter
        run: >-
          python3 scripts/validate_skills_frontmatter.py
          --git-diff ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/main' }}

      - name: Validate eval_queries coverage
        run: python3 scripts/validate_eval_queries.py

      - name: Affected skills regression (informational)
        run: python3 scripts/ci_affected_skills.py --from-git
        continue-on-error: true
        # NOTE: signal only; lists qcloud-*-ops skills touched by the diff, never blocks merges

      - name: Validate Well-Architected worker JSON examples
        run: python3 scripts/validate_product_assessment.py

      - name: Validate Markdown local links
        run: python3 scripts/check_markdown_links.py


      - name: Lint Python in Markdown code blocks
        run: python3 scripts/check_markdown_python.py --root .
      - name: GCL runner smoke test (structural critic, stubbed tccli)
        run: |
          set -euo pipefail
          # gcl_runner only executes `tccli`; an `echo ...` command is rejected
          # (exit -2) yet leaves CI green, so stub tccli on PATH and drive the
          # smoke test through a real allowlisted invocation.
          STUB_DIR="$(mktemp -d)"
          trap 'rm -rf "$STUB_DIR"' EXIT
          printf '%s\n' '#!/bin/sh' 'echo '"'"'{"Response":{"RequestId":"ci-smoke"}}'"'"'' > "$STUB_DIR/tccli"
          chmod +x "$STUB_DIR/tccli"
          PATH="$STUB_DIR:$PATH" python3 scripts/gcl_runner.py run \
            --skill qcloud-well-architected-review \
            --request "CI smoke test" \
            --command 'tccli cvm DescribeInstances --Limit 1' \
            --max-iter 1 \
            --structural-critic-only
          python3 scripts/gcl_trace_aggregate.py --since-hours 168

      - name: Script unit tests
        run: |
          cd scripts && python3 -m unittest discover -p "*_test.py" -v

      - name: GCL alarm wire plan (no mutations)
        run: |
          python3 scripts/gcl_alarm_wire.py plan \
            --summary scripts/fixtures/gcl-quality-summary-healthy.json

      - name: GCL Tier-A conformance (Charter C7)
        run: |
          python3 scripts/check_gcl_conformance.py

      - name: Charter C2-C6 compliance
        run: python3 scripts/validate_charter.py

      - name: CADL hook compliance
        run: python3 scripts/cadl_lint.py

      - name: Pattern anomaly detection (non-blocking alerts)
        run: |
          python3 scripts/pattern_anomaly_detect.py | tee audit-results/pattern-anomaly-$(date +%Y%m%d).json || true
        continue-on-error: true
        # NOTE: script outputs to stdout/stderr only; does not block merges
