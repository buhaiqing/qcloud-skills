name: Validate Skills

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ruff Python lint
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.11.8
          args: check --output-format=github .

      - name: Validate SKILL.md frontmatter
        run: >-
          python3 scripts/validate_skills_frontmatter.py
          --git-diff ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/main' }}

      - name: Validate eval_queries coverage
        run: python3 scripts/validate_eval_queries.py

      - name: Affected skills regression (informational)
        run: python3 scripts/ci_affected_skills.py --from-git
        continue-on-error: true
        # NOTE: signal only; lists qcloud-*-ops skills touched by the diff, never blocks merges

      - name: Validate Well-Architected worker JSON examples
        run: python3 scripts/validate_product_assessment.py

      - name: Validate Markdown local links
        run: python3 scripts/check_markdown_links.py


      - name: Lint Python in Markdown code blocks
        run: python3 scripts/check_markdown_python.py --root .
      - name: GCL runner smoke test (structural critic, stubbed tccli)
        env:
          # Unique run_id: the smoke record must land in its own
          # audit-results/evidence-ci-smoke-<run_id>.jsonl file. Without this the
          # run_id falls back to "local" (scripts/gcl_runner.py) and CI writes the
          # very stream the KPI#1/#2 safety gate reads — i.e. the gate would audit
          # a record this same job minted seconds earlier.
          HARNESS_RUN_ID: ci-smoke-${{ github.run_id }}
        run: |
          set -euo pipefail
          # gcl_runner only executes `tccli`; an `echo ...` command is rejected
          # (exit -2) yet leaves CI green, so stub tccli on PATH and drive the
          # smoke test through a real allowlisted invocation.
          STUB_DIR="$(mktemp -d)"
          trap 'rm -rf "$STUB_DIR"' EXIT
          printf '%s\n' '#!/bin/sh' 'echo '"'"'{"Response":{"RequestId":"ci-smoke"}}'"'"'' > "$STUB_DIR/tccli"
          chmod +x "$STUB_DIR/tccli"
          PATH="$STUB_DIR:$PATH" python3 scripts/gcl_runner.py run \
            --skill qcloud-well-architected-review \
            --request "CI smoke test" \
            --command 'tccli cvm DescribeInstances --Limit 1' \
            --max-iter 1 \
            --structural-critic-only
          python3 scripts/gcl_trace_aggregate.py --since-hours 168

      - name: Script unit tests
        run: |
          cd scripts && python3 -m unittest discover -p "*_test.py" -v

      - name: GCL alarm wire plan (no mutations)
        run: |
          python3 scripts/gcl_alarm_wire.py plan \
            --summary scripts/fixtures/gcl-quality-summary-healthy.json

      - name: Skill quality score (informational)
        run: |
          python3 scripts/skill_quality_score.py score --json \
            --since-hours 720 \
            2>&1 | head -50 || true
        continue-on-error: true
        # NOTE: signal only; aggregates per-skill upgrade_signal from audit-results/.
        # Skips gracefully when no traces exist (L10 convergence gate).

      - name: GCL Tier-A conformance (Charter C7)
        run: |
          python3 scripts/check_gcl_conformance.py

      - name: Charter C2-C6 compliance
        run: python3 scripts/validate_charter.py

      - name: CADL hook compliance
        run: python3 scripts/cadl_lint.py

      - name: Pattern anomaly detection (non-blocking alerts)
        run: |
          python3 scripts/pattern_anomaly_detect.py | tee audit-results/pattern-anomaly-$(date +%Y%m%d).json || true
        continue-on-error: true
        # NOTE: script outputs to stdout/stderr only; does not block merges

      - name: KPI gates (KPI#3 golden, KPI#7 router accuracy; KPI#1/#2 needs the local evidence stream)
        env:
          # KPI#1/#2 is SKIPPED here, deliberately and visibly: audit-results/ is
          # gitignored, so a CI checkout has no evidence stream and the only
          # records present would be the smoke-test one above. The gate refuses to
          # grade a synthetic single record as evidence (that was the round-1
          # defect) and fails closed instead; GATE_REQUIRE_EVIDENCE=0 is the
          # documented escape for an evidence-free environment. KPI#1/#2 is
          # enforced for real on a machine that has run the harness.
          GATE_REQUIRE_EVIDENCE: "0"
        run: python3 scripts/check_kpi_gates.py
        # NOTE: blocking. Same script the local `make kpi-gates` target runs;
        # thresholded (assets/shared/thresholds.json), so a router-accuracy or
        # golden-coverage regression fails the build.

      - name: Compounding-engineering checks
        run: |
          set -euo pipefail
          python3 scripts/check_spec_file_refs.py
          python3 scripts/check_doc_code_drift.py
          python3 scripts/check_yaml_python_drift.py
