name: Validate Skills

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ruff Python lint
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.11.8
          args: check --output-format=github .

      - name: Validate SKILL.md frontmatter (full corpus)
        run: python3 scripts/validate_skills_frontmatter.py
        # NOTE: `--git-diff` runs ONLY the version-bump gate — main() returns
        # before the field checks — so wiring that mode alone left the required
        # fields unguarded in CI: a SKILL.md with `environment:` deleted and its
        # version bumped passed this job (reproduced 2026-09-20). This step is
        # the field gate; the next one is the bump gate. Both are needed.
        # The fire/silent proof for this mode lives in
        # scripts/validate_skills_frontmatter_test.py (committed fixtures under
        # scripts/fixtures/frontmatter/), so it runs in CI and locally alike.

      - name: Validate SKILL.md version bumps (diff scope)
        run: >-
          python3 scripts/validate_skills_frontmatter.py
          --git-diff ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/main' }}

      - name: Validate eval_queries coverage
        run: python3 scripts/validate_eval_queries.py

      - name: Affected skills regression (informational)
        run: python3 scripts/ci_affected_skills.py --from-git
        continue-on-error: true
        # NOTE: signal only; lists qcloud-*-ops skills touched by the diff, never blocks merges

      - name: Validate Well-Architected worker JSON examples
        run: python3 scripts/validate_product_assessment.py

      - name: Validate Markdown local links
        run: python3 scripts/check_markdown_links.py


      - name: Lint Python in Markdown code blocks
        run: python3 scripts/check_markdown_python.py --root .
      - name: GCL runner smoke test (structural critic, stubbed tccli)
        env:
          # Unique run_id: the smoke record lands in its own
          # audit-results/evidence-ci-smoke-<run_id>.jsonl instead of mixing into
          # the developer stream evidence-local.jsonl.
          # NOTE: this is hygiene, NOT the guard on the KPI#1/#2 gate — the gate
          # globs `evidence-*.json*`, which matches this file too, so renaming it
          # excludes nothing. What keeps the gate honest is that its CI step
          # grades a committed fixture (see "KPI gates" below) rather than
          # whatever audit-results/ happens to contain.
          HARNESS_RUN_ID: ci-smoke-${{ github.run_id }}
        run: |
          set -euo pipefail
          # gcl_runner only executes `tccli`; an `echo ...` command is rejected
          # (exit -2) yet leaves CI green, so stub tccli on PATH and drive the
          # smoke test through a real allowlisted invocation.
          STUB_DIR="$(mktemp -d)"
          trap 'rm -rf "$STUB_DIR"' EXIT
          printf '%s\n' '#!/bin/sh' 'echo '"'"'{"Response":{"RequestId":"ci-smoke"}}'"'"'' > "$STUB_DIR/tccli"
          chmod +x "$STUB_DIR/tccli"
          PATH="$STUB_DIR:$PATH" python3 scripts/gcl_runner.py run \
            --skill qcloud-well-architected-review \
            --request "CI smoke test" \
            --command 'tccli cvm DescribeInstances --Limit 1' \
            --max-iter 1 \
            --structural-critic-only
          python3 scripts/gcl_trace_aggregate.py --since-hours 168

      - name: Install pytest (pinned to the local runner version)
        run: python3 -m pip install --disable-pip-version-check "pytest==7.4.4"

      - name: Script unit tests (pytest — collects both naming conventions)
        run: python3 -m pytest scripts -q
        # NOTE: the previous runner, `unittest discover -p "*_test.py"`, silently
        # skipped 292 of the 981 tests: 274 lived in `test_*.py` files (unittest's
        # own default pattern is `test*.py`, which the explicit -p overrode) and
        # ~18 more were pytest-style tests inside correctly-named files that
        # unittest cannot execute at all. pytest collects both patterns and both
        # styles, so the runner — not the file name — decides what executes.

      - name: Test collection floor (no orphan test files)
        run: python3 scripts/check_test_collection.py
        # NOTE: pytest exits non-zero when it collects nothing, which covers a
        # total collapse. This gate covers the partial case — a stray
        # conftest/pyproject deselecting most of the suite, or a new test file
        # named outside both patterns — by asserting the collected count against
        # assets/shared/thresholds.json:tests_min_collected and by requiring
        # every test file to appear in pytest's collected node ids.

      - name: GCL alarm wire plan (no mutations)
        run: |
          python3 scripts/gcl_alarm_wire.py plan \
            --summary scripts/fixtures/gcl-quality-summary-healthy.json

      - name: Skill quality score (informational)
        run: |
          python3 scripts/skill_quality_score.py score --json \
            --since-hours 720 \
            2>&1 | head -50 || true
        continue-on-error: true
        # NOTE: signal only; aggregates per-skill upgrade_signal from audit-results/.
        # Skips gracefully when no traces exist (L10 convergence gate).

      - name: GCL Tier-A conformance (Charter C7)
        run: |
          python3 scripts/check_gcl_conformance.py

      - name: Charter C2-C6 compliance
        run: python3 scripts/validate_charter.py

      - name: CADL hook compliance
        run: python3 scripts/cadl_lint.py

      - name: Pattern anomaly detection (non-blocking alerts)
        run: |
          python3 scripts/pattern_anomaly_detect.py | tee audit-results/pattern-anomaly-$(date +%Y%m%d).json || true
        continue-on-error: true
        # NOTE: script outputs to stdout/stderr only; does not block merges

      - name: KPI gates (KPI#1/#2 vs committed fixture; KPI#3/#7 on this checkout)
        run: |
          set -euo pipefail
          mkdir -p audit-results
          # The staged copies are synthetic and dated far forward, so they must not
          # survive into anyone's evidence directory (they match the default glob).
          trap 'rm -f audit-results/evidence-fixture.jsonl' EXIT
          # KPI#1/#2 is graded against a COMMITTED fixture, and against nothing
          # else. Two reasons it cannot be graded against audit-results/ as this
          # job finds it:
          #   (1) GATE_REQUIRE_EVIDENCE=0, the escape this step used to set, is not
          #       a guard at all: it returns before any file is read, so with it
          #       set KPI#1/#2 can never fail the build, whatever the evidence
          #       says. It remains the documented escape for a deliberately
          #       evidence-free repo, and is deliberately NOT set here.
          #   (2) audit-results/ on a CI runner is machine-local and gitignored, so
          #       it holds no fleet evidence — only what earlier steps in this job
          #       happened to write. The smoke test above writes one synthetic
          #       record there right now, and until the unit tests were isolated
          #       (2026-09) they minted 17 more. Renaming a file excludes nothing:
          #       the gate globs `evidence-*.json*`, so any of them would be read.
          # What makes the graded bytes trustworthy is that this step writes the
          # file itself, from scripts/fixtures/evidence/, and names exactly that
          # file via GATE_EVIDENCE_GLOB.
          cp scripts/fixtures/evidence/evidence-safety-clean.jsonl \
             audit-results/evidence-fixture.jsonl
          GATE_EVIDENCE_GLOB=evidence-fixture.jsonl python3 scripts/check_kpi_gates.py
          # L6, fire side: the same rules must REJECT the known-violating fixture
          # (leak_checked:false + destructive without token/plan_hash). If this
          # step stops going red on it, the safety rules have stopped working.
          cp scripts/fixtures/evidence/evidence-safety-violating.jsonl \
             audit-results/evidence-fixture.jsonl
          if GATE_EVIDENCE_GLOB=evidence-fixture.jsonl python3 scripts/check_kpi_gates.py; then
            echo "::error::KPI#1/#2 did not fire on the known-violating fixture"
            exit 1
          fi
        # NOTE: blocking. Same script the local `make kpi-gates` target runs;
        # thresholded (assets/shared/thresholds.json), so a router-accuracy,
        # golden-coverage or registry-shrink regression fails the build.
        # Blocking is a property of this step, NOT of the workflow run: it is not
        # the first blocking step in the job, and Actions aborts the job at the
        # first non-`continue-on-error` failure, so a red earlier step silently
        # skips this one. A green workflow therefore means "nothing upstream was
        # red", not "the KPI gate passed" — read the step list, not the run badge.
        # (This note used to pin "step 16 of 17"; the number drifted the moment a
        # step was added, which is the drift this repo keeps re-learning.)

      - name: Gate wiring (both ends of every contract)
        run: python3 scripts/check_gate_wiring.py
        # NOTE: asserts the seams this repo keeps losing: a script that calls
        # itself a CI gate must have an automation caller; every `gates:` entry in
        # assets/shared/validation_commands.yaml must exist and be wired; every
        # thresholds.json key must have a consumer; the reflexion store path must
        # be declared in exactly one module. Each rule was proven to fire and to
        # stay silent in scripts/check_gate_wiring_test.py.

      - name: Error table structure
        run: python3 scripts/validate_error_tables.py
        # NOTE: this script's docstring called itself a "CI gate" while no
        # workflow, Makefile or pre-commit hook referenced it — a false
        # guarantee. It is now wired here and in `make error-tables`.

      - name: Compounding-engineering checks
        run: |
          set -euo pipefail
          python3 scripts/check_spec_file_refs.py
          python3 scripts/check_doc_code_drift.py
          python3 scripts/check_yaml_python_drift.py
