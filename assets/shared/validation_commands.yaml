# Canonical validation manifest (TE-4 shared constant).
#
# Consumed by `scripts/check_gate_wiring.py` (rule W2). The split is load-bearing:
#   gates: every entry MUST be wired into >= 1 automation surface
#          (Makefile / .github/workflows / .pre-commit-config.yaml / .githooks /
#           scripts/validate_local.py). An unwired gate is a false guarantee.
#   tools: human-invoked entry points; wiring is NOT required. They are excluded
#          because they need something a CI runner does not have — tccli +
#          network (kb_drift_check), local audit-results fixtures
#          (shadow_replay_smoke), a required argument (reflexion_retrieve), or
#          they are report-only (reflexion_efficacy) / writers
#          (reflexion_auto_write mutates a committed file).
gates:
  validate_frontmatter: "python3 scripts/validate_skills_frontmatter.py --git-diff HEAD"
  frontmatter_full: "python3 scripts/validate_skills_frontmatter.py"
  validate_assessment: "python3 scripts/validate_product_assessment.py"
  validate_gcl: "python3 scripts/check_gcl_conformance.py"
  validate_cadl: "python3 scripts/cadl_lint.py"
  validate_python: "ruff check"
  validate_links: "python3 scripts/check_markdown_links.py"
  validate_markdown_python: "python3 scripts/check_markdown_python.py --root ."
  validate_local: "python3 scripts/validate_local.py"
  error_tables: "python3 scripts/validate_error_tables.py"
  gate_wiring: "python3 scripts/check_gate_wiring.py"
  test_collection: "python3 scripts/check_test_collection.py"
  script_tests: "python3 -m pytest scripts -q"
  gcl_smoke: "python3 scripts/gcl_runner.py --structural-critic-only"
  gcl_trace_aggregate: "python3 scripts/gcl_trace_aggregate.py --since-hours 168"
  skill_quality_score: "python3 scripts/skill_quality_score.py --json"
  gcl_alarm_wire: "python3 scripts/gcl_alarm_wire.py plan --summary scripts/fixtures/gcl-quality-summary-healthy.json"

tools:
  reflexion_retrieve: "python3 scripts/reflexion_retrieve.py retrieve --skill"
  reflexion_auto_write: "python3 scripts/reflexion_auto_writer.py"
  reflexion_auto_write_dry: "python3 scripts/reflexion_auto_writer.py --dry-run"
  kb_drift_check: "python3 scripts/kb_sync_openapi.py --check"
  reflexion_efficacy: "python3 scripts/reflexion_efficacy.py --json"
  shadow_replay_smoke: "python3 scripts/tccli_shadow.py exec --fixture-dir audit-results/shadow-fixtures"
