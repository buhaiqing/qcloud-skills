target-version = "py311"
line-length = 100

exclude = [
  ".git",
  ".omc",
  ".omo",
  ".codebuddy",
  ".ruff_cache",
  "audit-results",
  "*.md",
]

[lint]
# Pre-existing style rules whose fixes would either require behavior changes
# (timezone-aware datetimes) or only affect micro-style/perf. Suppressed so
# `ruff check scripts/` can reach zero without touching stable code paths.
# Re-evaluate per-file with noqa if a real bug surfaces.
ignore = [
  "DTZ005",  # datetime.now() without tzinfo — codebase intentionally naive
  "DTZ007",  # datetime.strptime() without zone
  "DTZ011",  # date.today() without tzinfo
  "PERF402", # manual-list-copy (list(x)) — perf, not correctness
  "SIM113",  # enumerate-for-loop — micro-style
  "SIM115",  # open-file-with-context-handler — covered by readers
  "SIM117",  # multiple-with-statements — micro-style
]
