target-version = "py311"
line-length = 100

exclude = [
  ".git",
  ".omc",
  ".omo",
  ".codebuddy",
  ".ruff_cache",
  "audit-results",
  "*.md",
]

[lint]
# Pin the rule set so lint coverage cannot drift with the ruff version. With no
# explicit `select`, each ruff release applies its own default set, so CI (ruff
# 0.11.8, pinned in .github/workflows/validate-skills.yml) and a newer local
# ruff can silently disagree — 0.16.x dropped E4/E7 from its defaults, which
# hid E402/E741 locally while CI stayed red. This is ruff's long-standing
# default set, confirmed against 0.11.8 with `ruff check --show-settings`
# (linter.rules.enabled). It is pinned to the CI version on purpose: raising it
# is a deliberate, coverage-reviewed step, not a side effect of reinstalling.
select = ["E4", "E7", "E9", "F"]

# Pre-existing style rules whose fixes would either require behavior changes
# (timezone-aware datetimes) or only affect micro-style/perf. Suppressed so
# `ruff check scripts/` can reach zero without touching stable code paths.
# Re-evaluate per-file with noqa if a real bug surfaces.
ignore = [
  "DTZ005",  # datetime.now() without tzinfo — codebase intentionally naive
  "DTZ007",  # datetime.strptime() without zone
  "DTZ011",  # date.today() without tzinfo
  "E402",    # module-import-not-at-top-of-file — deliberate throughout this
             # repo: modules insert sys.path BEFORE importing sibling scripts
             # (the sys.path-then-import pattern), so those imports cannot sit
             # at the top of the file. Re-evaluate per-file with noqa if a real
             # import-ordering bug surfaces.
  "EXE001",  # shebang not executable — scripts are invoked via python3 explicitly
  "PERF402", # manual-list-copy (list(x)) — perf, not correctness
  "SIM113",  # enumerate-for-loop — micro-style
  "SIM115",  # open-file-with-context-handler — covered by readers
  "SIM117",  # multiple-with-statements — micro-style
]
