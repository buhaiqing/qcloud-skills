repos:
  - repo: local
    hooks:
      - id: check-spec-file-refs
        name: Verify spec file references exist on disk
        entry: python3 scripts/check_spec_file_refs.py
        language: system
        pass_filenames: false
        types: [markdown]
      - id: check-doc-code-drift
        name: Detect oversized code blocks in spec docs
        entry: python3 scripts/check_doc_code_drift.py
        language: system
        pass_filenames: false
        types: [markdown]
      - id: check-yaml-python-drift
        name: Detect YAML ↔ Python dependency drift
        entry: python3 scripts/check_yaml_python_drift.py
        language: system
        pass_filenames: false
        types: [python]
      - id: check-idempotency
        name: Check tccli/sdk calls set ClientToken (idempotency)
        entry: python3 scripts/check_idempotency.py
        language: system
        pass_filenames: false
        types: [python]
      - id: check-requestid-capture
        name: Check tccli response handling captures RequestId (traceability)
        entry: python3 scripts/check_requestid_capture.py
        language: system
        pass_filenames: false
        types: [python]
